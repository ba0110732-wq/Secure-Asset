kind = "web"
previewPath = "/"
title = "Eng. Abdulrazzaq Najib Al-Najjar"
version = "1.0.0"
id = "artifacts/engineer-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22078

[services.development]
run = "pnpm --filter @workspace/engineer-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/engineer-portal", "run", "build" ]
publicDir = "artifacts/engineer-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22078"
BASE_PATH = "/"
